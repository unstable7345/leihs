# The leihs deploy deletes /etc/apache2/leihs on every run. To keep this rule,
# put it in reverse_proxy_custom_config in the deploy inventory (see README).
# Copying this file to /etc/apache2/leihs/conf.d/ only lasts until the next deploy.
ProxyPass /ms-auth http://localhost:3999/ms-auth nocanon retry=0
